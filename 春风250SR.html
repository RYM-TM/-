<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>250SR-Dream-Dash | 春风攒钱仪表盘</title>
    <style>
        /* ========== CSS Variables & Theme System ========== */
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-light: #222;
            --border: #333;
            --text: #e0e0e0;
            --text-dim: #999;
            --accent: #ff6b2b;
            --accent-glow: #ff8c52;
            --green: #00e676;
            --yellow: #ffd600;
            --red: #ff1744;
            --blue: #4db6e8;
            --danger: #ff3d3d;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
            --bg-glow-1: rgba(255, 107, 43, 0.06);
            --bg-glow-2: rgba(0, 180, 220, 0.04);
            --bg-glow-3: rgba(255, 107, 43, 0.03);
        }

        /* Time-of-day theme variants */
        :root.theme-morning {
            --bg: #0f0e0d;
            --bg-glow-1: rgba(255, 160, 60, 0.08);
            --bg-glow-2: rgba(255, 200, 100, 0.05);
            --bg-glow-3: rgba(255, 140, 50, 0.04);
            --accent: #ff8c42;
            --accent-glow: #ffa864;
        }
        :root.theme-afternoon {
            --bg: #0d0d0d;
            --bg-glow-1: rgba(255, 107, 43, 0.06);
            --bg-glow-2: rgba(0, 180, 220, 0.04);
            --bg-glow-3: rgba(255, 107, 43, 0.03);
        }
        :root.theme-evening {
            --bg: #0a0a10;
            --bg-glow-1: rgba(200, 80, 150, 0.07);
            --bg-glow-2: rgba(80, 60, 180, 0.05);
            --bg-glow-3: rgba(180, 100, 60, 0.04);
            --accent: #e8659a;
            --accent-glow: #f080b0;
        }
        :root.theme-night {
            --bg: #050510;
            --bg-glow-1: rgba(60, 80, 200, 0.06);
            --bg-glow-2: rgba(40, 40, 120, 0.04);
            --bg-glow-3: rgba(30, 30, 100, 0.03);
            --accent: #6b8cff;
            --accent-glow: #8aa4ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            background-image:
                radial-gradient(ellipse at 50% 25%, var(--bg-glow-1) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 70%, var(--bg-glow-2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, var(--bg-glow-3) 0%, transparent 50%);
            transition: background-color 1.5s ease, background-image 1.5s ease;
        }

        /* ========== Focus visible (accessibility) ========== */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }
        :focus:not(:focus-visible) {
            outline: none;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 340px;
            grid-template-rows: auto auto auto;
            gap: 18px;
            grid-template-areas:
                "gauge gauge"
                "left right"
                "bottom bottom";
        }

        /* ========== 仪表盘区域 ========== */
        .gauge-section {
            grid-area: gauge;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 0;
            position: relative;
            overflow: visible;
        }
        .gauge-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        canvas#gaugeCanvas {
            display: block;
            width: 380px;
            height: 380px;
            filter: drop-shadow(0 0 18px rgba(255, 107, 43, 0.2));
            transition: filter 0.5s ease;
        }
        .gauge-center-label {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }
        .gauge-center-label .saved-amount {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .gauge-center-label .saved-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gauge-center-label .countdown-text {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--blue);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ========== 左侧：费用条目 ========== */
        .left-panel {
            grid-area: left;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
        }
        .panel-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title-left::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .panel-actions {
            display: flex;
            gap: 6px;
        }
        .panel-actions .btn-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #1f1f1f;
            color: #aaa;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            line-height: 1;
        }
        .panel-actions .btn-icon:hover {
            background: #333;
            color: #fff;
            border-color: #666;
        }
        .expense-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .expense-list::-webkit-scrollbar { width: 4px; }
        .expense-list::-webkit-scrollbar-track { background: transparent; }
        .expense-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .expense-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 11px;
            background: var(--surface-light);
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all var(--transition);
            flex-wrap: wrap;
            position: relative;
            cursor: grab;
        }
        .expense-item:active { cursor: grabbing; }
        .expense-item:hover { border-color: #444; background: #252525; }
        .expense-item.drag-over { border-color: var(--accent); background: #2a2018; }
        .expense-item.dragging { opacity: 0.4; }
        .expense-item.covered {
            opacity: 0.55;
            text-decoration: line-through;
            text-decoration-color: var(--text-dim);
            text-decoration-thickness: 1px;
            background: #1a1a1a;
            border-color: #2a2a2a;
        }
        .expense-item.covered .expense-name,
        .expense-item.covered .expense-amount-display { color: #777; }
        .expense-item .item-image {
            width: 40px; height: 40px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #333;
            cursor: pointer;
            transition: all var(--transition);
        }
        .expense-item .item-image:hover { border-color: var(--accent); transform: scale(1.05); }
        .expense-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px; height: 20px;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all var(--transition);
            background: transparent;
        }
        .expense-checkbox:checked {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 107, 43, 0.4);
        }
        .expense-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }
        .expense-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .expense-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color var(--transition);
        }
        .expense-amount-display {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .expense-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .btn-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #1f1f1f;
            color: #aaa;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            line-height: 1;
        }
        .btn-icon:hover { background: #333; color: #fff; border-color: #666; }
        .btn-icon.danger:hover { background: #3d1515; border-color: var(--danger); color: var(--danger); }
        .btn-icon.edit:hover { border-color: var(--blue); color: var(--blue); background: #1a2530; }
        .btn-icon.image-btn:hover { border-color: var(--green); color: var(--green); background: #152a1a; }
        .expense-edit-row {
            display: flex;
            gap: 4px;
            width: 100%;
            align-items: center;
            flex-wrap: wrap;
        }
        .expense-edit-row input {
            flex: 1;
            min-width: 60px;
            padding: 5px 8px;
            background: #111;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 0.8rem;
            font-family: var(--font-sans);
        }
        .expense-edit-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(255, 107, 43, 0.2);
        }
        .btn-mini {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #ddd;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .btn-mini:hover { background: #3a3a3a; border-color: #888; }
        .btn-mini.save {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .btn-mini.save:hover { background: #ff7d3d; box-shadow: 0 0 12px rgba(255, 107, 43, 0.4); }
        .btn-mini.cancel { background: #2a2a2a; border-color: #555; }
        .add-expense-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 4px;
        }
        .add-expense-row input {
            flex: 1;
            min-width: 70px;
            padding: 7px 10px;
            background: #111;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 0.8rem;
            font-family: var(--font-sans);
        }
        .add-expense-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(255, 107, 43, 0.2);
        }
        .btn-add {
            padding: 7px 14px;
            border-radius: 4px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .btn-add:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 14px rgba(255, 107, 43, 0.4);
        }
        .inline-error {
            font-size: 0.7rem;
            color: var(--danger);
            padding: 2px 0;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }

        /* ========== 右侧面板 ========== */
        .right-panel {
            grid-area: right;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .daily-record-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .daily-record-row input {
            flex: 1;
            min-width: 80px;
            padding: 10px 12px;
            background: #111;
            border: 2px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            transition: all var(--transition);
        }
        .daily-record-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(255, 107, 43, 0.3);
        }
        .btn-confirm {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all var(--transition);
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(255, 107, 43, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-confirm:hover {
            background: #ff7d3d;
            box-shadow: 0 6px 24px rgba(255, 107, 43, 0.5);
            transform: translateY(-1px);
        }
        .btn-confirm:active { transform: scale(0.96); transition: transform 0.08s ease; }
        /* Ripple effect */
        .btn-confirm .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: ripple-anim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }
        .today-hint {
            font-size: 0.78rem;
            color: var(--yellow);
            padding: 6px 10px;
            background: rgba(255, 214, 0, 0.08);
            border-radius: 4px;
            border-left: 3px solid var(--yellow);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .today-hint .hint-actions {
            display: flex;
            gap: 6px;
        }
        .today-hint .hint-actions button {
            padding: 3px 10px;
            border-radius: 3px;
            border: 1px solid #666;
            background: #1f1f1f;
            color: #ddd;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all var(--transition);
        }
        .today-hint .hint-actions button:hover { background: #333; border-color: #aaa; }
        .today-hint .hint-actions button.overwrite-btn {
            border-color: var(--accent);
            color: var(--accent);
        }
        .today-hint .hint-actions button.overwrite-btn:hover {
            background: #2d1a10;
            border-color: var(--accent-glow);
        }
        .today-hint .hint-actions button.delete-today-btn {
            border-color: var(--danger);
            color: var(--danger);
        }
        .today-hint .hint-actions button.delete-today-btn:hover { background: #2d1010; }

        /* ===== 计算器 ===== */
        .calculator-display {
            background: #0a0a0a;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 12px;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 600;
            color: #fff;
            border: 1px solid #2a2a2a;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        .calculator-display.shrink { font-size: 1.1rem; }
        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .calc-btn {
            padding: 12px 0;
            border-radius: var(--radius-sm);
            border: 1px solid #333;
            background: #1c1c1c;
            color: #ddd;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            text-align: center;
            line-height: 1.2;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .calc-btn:hover { background: #2c2c2c; border-color: #555; }
        .calc-btn:active { transform: scale(0.94); transition: transform 0.06s ease; }
        .calc-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple-anim 0.5s ease-out;
            pointer-events: none;
        }
        .calc-btn.num { background: #181818; color: #f0f0f0; }
        .calc-btn.num:hover { background: #282828; }
        .calc-btn.op { background: #252525; color: var(--accent); border-color: #3a3a3a; }
        .calc-btn.op:hover { background: #333; border-color: var(--accent); }
        .calc-btn.eq {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 12px rgba(255, 107, 43, 0.25);
        }
        .calc-btn.eq:hover { background: #ff7d3d; box-shadow: 0 4px 20px rgba(255, 107, 43, 0.4); }
        .calc-btn.clear { background: #2a1515; color: var(--danger); border-color: #3a1a1a; }
        .calc-btn.clear:hover { background: #3d1a1a; border-color: var(--danger); }
        .calc-btn.span-2 { grid-column: span 2; }

        /* ===== 历史日志 ===== */
        .log-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-track { background: transparent; }
        .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .log-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--surface-light);
            border-radius: 4px;
            font-size: 0.8rem;
            gap: 8px;
            transition: background var(--transition);
        }
        .log-item:hover { background: #282828; }
        .log-date { color: #aaa; font-family: var(--font-mono); font-size: 0.75rem; white-space: nowrap; }
        .log-amount { font-family: var(--font-mono); font-weight: 600; color: #fff; letter-spacing: 1px; }
        .log-delete {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 1px solid transparent;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 0.65rem;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .log-delete:hover { color: var(--danger); border-color: var(--danger); background: #2d1010; }
        .log-empty { text-align: center; color: #555; font-size: 0.8rem; padding: 16px; }

        /* ===== 趋势迷你图 ===== */
        .trend-canvas {
            width: 100%;
            height: 60px;
            margin-bottom: 8px;
            border-radius: 4px;
            background: #0a0a0a;
            border: 1px solid #222;
        }

        /* ========== 底部汇总栏 ========== */
        .bottom-bar {
            grid-area: bottom;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-item {
            text-align: center;
            min-width: 100px;
            flex: 1;
        }
        .stat-value {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .stat-value.target { color: var(--blue); }
        .stat-value.saved { color: var(--green); }
        .stat-value.remaining { color: var(--accent); }
        .stat-value.prediction { color: var(--yellow); }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ========== 推背感动画 ========== */
        .thrust-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 999;
            font-size: 3rem;
            font-weight: 900;

    <script>
    (function() {
        // ==================== 常量 ====================
        const STORAGE_KEY = 'SR250DreamDash_v2';
        const THRUST_POOL = ['嗡！','咻！','嗷！','突突！','嗖！','轰！','唰！','呜呜！','噼啪！','Boom！','Zoom！','Vroom！','嘎呜！','嘶——','嘭！'];
        const GAUGE_START_ANGLE = (135 * Math.PI) / 180;
        const GAUGE_END_ANGLE = (405 * Math.PI) / 180;
        const GAUGE_TOTAL_SPAN = GAUGE_END_ANGLE - GAUGE_START_ANGLE;

        // ==================== DOM引用 ====================
        const canvas = document.getElementById('gaugeCanvas');
        const ctx = canvas.getContext('2d');
        const centerSavedEl = document.getElementById('centerSaved');
        const countdownTextEl = document.getElementById('countdownText');
        const expenseListEl = document.getElementById('expenseList');
        const dailyAmountInput = document.getElementById('dailyAmount');
        const btnConfirmRecord = document.getElementById('btnConfirmRecord');
        const todayHintEl = document.getElementById('todayHint');
        const logListEl = document.getElementById('logList');
        const logEmptyEl = document.getElementById('logEmpty');
        const statTargetEl = document.getElementById('statTarget');
        const statSavedEl = document.getElementById('statSaved');
        const statRemainingEl = document.getElementById('statRemaining');
        const statPredictionEl = document.getElementById('statPrediction');
        const thrustContainer = document.getElementById('thrustContainer');
        const achievementContainer = document.getElementById('achievementContainer');
        const btnAddExpense = document.getElementById('btnAddExpense');
        const newExpenseNameInput = document.getElementById('newExpenseName');
        const newExpenseAmountInput = document.getElementById('newExpenseAmount');
        const expenseErrorEl = document.getElementById('expenseError');
        const calcDisplay = document.getElementById('calcDisplay');
        const shareModal = document.getElementById('shareModal');
        const shareCanvas = document.getElementById('shareCanvas');
        const trendCanvas = document.getElementById('trendCanvas');
        const trendCtx = trendCanvas.getContext('2d');
        const targetDateInput = document.getElementById('targetDate');
        const toggleSoundBtn = document.getElementById('toggleSound');
        const toggleEngineBtn = document.getElementById('toggleEngine');

        // ==================== 数据状态 ====================
        let appData = {
            expenseItems: [],
            records: [],
            targetDate: null,
            soundEnabled: true,
            engineEnabled: true,
        };
        let editingExpenseId = null;
        let currentPointerAngle = GAUGE_START_ANGLE;
        let targetPointerAngle = GAUGE_START_ANGLE;
        let pointerVelocity = 0;
        let animationId = null;
        let isAnimating = false;
        let lastProgress = 0;
        let milestonesTriggered = {};

        // ===== 计算器状态 =====
        let calcState = { currentInput: '0', previousInput: '', operator: null, shouldResetDisplay: false, lastAction: null };

        // ===== 音频上下文 =====
        let audioCtx = null;

        // ==================== 工具函数 ====================
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function formatCurrency(num) {
            if (num >= 10000) { const wan = num / 10000; return '¥' + (wan === Math.floor(wan) ? wan : wan.toFixed(1)) + '万'; }
            return '¥' + num.toLocaleString('zh-CN');
        }
        function formatCurrencyCompact(num) {
            if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }
        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function getDateStr(dateObj) {
            return dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
        }
        function formatDateDisplay(dateStr) {
            const parts = dateStr.split('-');
            return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== 数据访问 ====================
        function getExpenseItems() { return appData.expenseItems || []; }
        function getRecords() { return appData.records || []; }
        function getTargetDate() { return appData.targetDate || null; }
        function setTargetDate(val) { appData.targetDate = val; saveData(); }
        function getTotalTarget() { return getExpenseItems().filter(it => !it.covered).reduce((s, it) => s + it.amount, 0); }
        function getTotalSaved() { return getRecords().reduce((s, r) => s + r.amount, 0); }
        function getProgressPercent() { const t = getTotalTarget(); if (t <= 0) return 1; return Math.min(getTotalSaved() / t, 1); }
        function getRemainingGap() { return Math.max(0, getTotalTarget() - getTotalSaved()); }
        function progressToAngle(progress) { return GAUGE_START_ANGLE + progress * GAUGE_TOTAL_SPAN; }
        function getTodayRecord() { const today = getTodayStr(); return getRecords().find(r => r.date === today) || null; }

        // ==================== 数据持久化 ====================
        function saveData() {
            try {
                const toSave = {
                    expenseItems: appData.expenseItems,
                    records: appData.records,
                    targetDate: appData.targetDate,
                    soundEnabled: appData.soundEnabled,
                    engineEnabled: appData.engineEnabled,
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
            } catch (e) {
                console.warn('存储失败:', e);
                if (e.name === 'QuotaExceededError') {
                    alert('⚠️ 本地存储空间已满！请导出数据后清理旧记录。');
                }
            }
        }
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // Support both old multi-garage format and new single format
                    if (parsed.garages && Array.isArray(parsed.garages) && parsed.garages.length > 0) {
                        const activeId = parsed.activeGarageId || parsed.garages[0].id;
                        const activeG = parsed.garages.find(g => g.id === activeId) || parsed.garages[0];
                        appData.expenseItems = (activeG.expenseItems || []).map(it => ({ ...it, id: it.id || generateId() }));
                        appData.records = activeG.records || [];
                        appData.targetDate = activeG.targetDate || null;
                    } else {
                        appData.expenseItems = (parsed.expenseItems || []).map(it => ({ ...it, id: it.id || generateId() }));
                        appData.records = parsed.records || [];
                        appData.targetDate = parsed.targetDate || null;
                    }
                    appData.soundEnabled = parsed.soundEnabled !== false;
                    appData.engineEnabled = parsed.engineEnabled !== false;
                }
                if (!appData.expenseItems || appData.expenseItems.length === 0) initDefaultData();
            } catch (e) {
                console.warn('读取失败:', e);
                initDefaultData();
            }
        }
        function initDefaultData() {
            appData.expenseItems = [
                { id: generateId(), name: '裸车价（250SR）', amount: 19980, covered: false, image: null },
                { id: generateId(), name: '购置税', amount: 1768, covered: false, image: null },
                { id: generateId(), name: '交强险', amount: 400, covered: false, image: null },
                { id: generateId(), name: '上牌费', amount: 500, covered: false, image: null },
                { id: generateId(), name: '商业险', amount: 1200, covered: false, image: null },
                { id: generateId(), name: '头盔护具', amount: 2000, covered: false, image: null },
                { id: generateId(), name: '骑行装备', amount: 1500, covered: false, image: null },
            ];
            appData.records = [];
            appData.targetDate = null;
            saveData();
        }
        function exportData() {
            const blob = new Blob([JSON.stringify({ expenseItems: appData.expenseItems, records: appData.records, targetDate: appData.targetDate }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '250SR-攒钱备份-' + getTodayStr() + '.json'; a.click();
            URL.revokeObjectURL(url);
        }
        function importData() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        // Support both old multi-garage and new single format
                        if (data.garages && Array.isArray(data.garages) && data.garages.length > 0) {
                            const activeId = data.activeGarageId || data.garages[0].id;
                            const activeG = data.garages.find(g => g.id === activeId) || data.garages[0];
                            appData.expenseItems = (activeG.expenseItems || []).map(it => ({ ...it, id: it.id || generateId() }));
                            appData.records = activeG.records || [];
                            appData.targetDate = activeG.targetDate || null;
                        } else if (data.expenseItems) {
                            appData.expenseItems = data.expenseItems.map(it => ({ ...it, id: it.id || generateId() }));
                            appData.records = data.records || [];
                            appData.targetDate = data.targetDate || null;
                        } else {
                            alert('❌ 文件格式不正确'); return;
                        }
                        saveData();
                        refreshAll();
                        alert('✅ 数据导入成功！');
                    } catch (err) { alert('❌ 文件解析失败: ' + err.message); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ==================== 音频系统 ====================
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;

        function playBeep(freq, duration, type, vol) {

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playEngineRev(amount) {

                osc.frequency.linearRampToValueAtTime(baseFreq * 1.5, ctx.currentTime + 0.15);
                osc.frequency.linearRampToValueAtTime(baseFreq * 0.8, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.06 * intensity, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);

        // ==================== 仪表盘绘制 (HiDPI) ====================
        function setupHiDPI() {
            const dpr = window.devicePixelRatio || 1;
            const displayW = canvas.clientWidth;
            const displayH = canvas.clientHeight;
            if (canvas.width !== displayW * dpr || canvas.height !== displayH * dpr) {
                canvas.width = displayW * dpr;
                canvas.height = displayH * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }
        function drawGauge(pointerAngle) {
            setupHiDPI();
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            const cx = w / 2;
            const cy = h / 2 + 8;
            const radius = 155;
            const innerRadius = radius - 38;
            const arcWidth = 16;
            const arcOuterR = radius - 14;
            const arcInnerR = arcOuterR - arcWidth;

            ctx.clearRect(0, 0, w, h);

            const totalTarget = getTotalTarget();
            const progress = totalTarget > 0 ? getProgressPercent() : 1;

            // Outer ring
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();
            ctx.restore();

            // Outer bezel
            ctx.save();
            const outerGrad = ctx.createRadialGradient(cx, cy, radius - 2, cx, cy, radius + 4);
            outerGrad.addColorStop(0, '#3a3a3a'); outerGrad.addColorStop(0.5, '#555'); outerGrad.addColorStop(1, '#1a1a1a');
            ctx.beginPath(); ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
            ctx.fillStyle = outerGrad; ctx.fill(); ctx.restore();

            // Face
            ctx.save();
            const faceGrad = ctx.createRadialGradient(cx, cy, innerRadius - 10, cx, cy, radius);
            faceGrad.addColorStop(0, '#1c1c1c'); faceGrad.addColorStop(1, '#111');
            ctx.beginPath(); ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
            ctx.fillStyle = faceGrad; ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();

            // Color segments
            const colorSegments = [
                { start: 0, end: 0.60, color: '#00e676' },
                { start: 0.60, end: 0.85, color: '#ffd600' },
                { start: 0.85, end: 1.0, color: '#ff1744' },
            ];
            colorSegments.forEach(seg => {
                const startA = GAUGE_START_ANGLE + seg.start * GAUGE_TOTAL_SPAN;
                const endA = GAUGE_START_ANGLE + seg.end * GAUGE_TOTAL_SPAN;
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, arcOuterR, startA, endA);
                ctx.arc(cx, cy, arcInnerR, endA, startA, true);
                ctx.closePath();
                ctx.fillStyle = seg.color; ctx.globalAlpha = 0.55; ctx.fill();
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = seg.color; ctx.lineWidth = 1; ctx.stroke();
                ctx.restore();
            });

            // Ticks
            const totalTicks = 50;
            for (let i = 0; i <= totalTicks; i++) {
                const fraction = i / totalTicks;
                const angle = GAUGE_START_ANGLE + fraction * GAUGE_TOTAL_SPAN;
                const isMajor = i % 5 === 0;
                const tickOuterR = radius - 16;
                const tickInnerR = isMajor ? radius - 38 : radius - 28;
                const tickWidth = isMajor ? 2.5 : 1;
                const x1 = cx + Math.cos(angle) * tickOuterR;
                const y1 = cy + Math.sin(angle) * tickOuterR;
                const x2 = cx + Math.cos(angle) * tickInnerR;
                const y2 = cy + Math.sin(angle) * tickInnerR;
                ctx.save();
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.strokeStyle = isMajor ? '#e0e0e0' : '#666';
                ctx.lineWidth = tickWidth; ctx.lineCap = 'round'; ctx.stroke();
                ctx.restore();
                if (isMajor && totalTarget > 0) {
                    const labelR = tickInnerR - 16;
                    const lx = cx + Math.cos(angle) * labelR;
                    const ly = cy + Math.sin(angle) * labelR;
                    const labelValue = Math.round(fraction * totalTarget);
                    ctx.save();
                    ctx.font = 'bold 10px "SF Mono","Consolas",monospace';
                    ctx.fillStyle = '#ccc'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(formatCurrencyCompact(labelValue), lx, ly);
                    ctx.restore();
                }
            }
            if (totalTarget > 0) {
                const zeroAngle = GAUGE_START_ANGLE;
                const zr = arcInnerR - 16;
                const zx = cx + Math.cos(zeroAngle) * zr;
                const zy = cy + Math.sin(zeroAngle) * zr;
                ctx.save();
                ctx.font = 'bold 10px "SF Mono","Consolas",monospace';
                ctx.fillStyle = '#ccc'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('0', zx, zy);
                ctx.restore();
            }

            // Inner ring
            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, arcInnerR - 2, 0, Math.PI * 2);
            ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.restore();

            // Pointer shadow
            ctx.save();
            drawPointer(cx, cy, radius - 42, pointerAngle + 0.015, 'rgba(0,0,0,0.35)', 5);
            ctx.restore();
            // Pointer
            drawPointer(cx, cy, radius - 42, pointerAngle, '#ff2d2d', 3.5);
            drawPointer(cx, cy, radius - 48, pointerAngle, '#ff6b6b', 0.8);

            // Center cap
            ctx.save();
            const centerGrad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 18);
            centerGrad.addColorStop(0, '#fff'); centerGrad.addColorStop(0.3, '#ddd');
            centerGrad.addColorStop(0.7, '#333'); centerGrad.addColorStop(1, '#111');
            ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.fillStyle = centerGrad; ctx.fill();
            ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
            // Center dot
            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333'; ctx.fill();
            ctx.shadowColor = 'rgba(255,50,50,0.7)'; ctx.shadowBlur = 10; ctx.fill();
            ctx.restore();

            // Percentage text
            const pctText = totalTarget > 0 ? Math.round(progress * 100) + '%' : '100%';
            ctx.save();
            ctx.font = 'bold 20px "SF Mono","Consolas",monospace';
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(pctText, cx, cy - radius + 70);
            ctx.restore();
        }
        function drawPointer(cx, cy, length, angle, color, lineWidth) {
            ctx.save();
            const tipX = cx + Math.cos(angle) * length;
            const tipY = cy + Math.sin(angle) * length;
            const baseWidth = 9;
            const perpAngle = angle + Math.PI / 2;
            const baseCX = cx - Math.cos(angle) * 22;
            const baseCY = cy - Math.sin(angle) * 22;
            const bx1 = baseCX + Math.cos(perpAngle) * baseWidth;
            const by1 = baseCY + Math.sin(perpAngle) * baseWidth;
            const bx2 = baseCX - Math.cos(perpAngle) * baseWidth;
            const by2 = baseCY - Math.sin(perpAngle) * baseWidth;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY); ctx.lineTo(bx1, by1); ctx.lineTo(bx2, by2); ctx.closePath();
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = lineWidth * 0.5; ctx.stroke();
            ctx.restore();
        }

        // ==================== 动画循环（防抖合并） ====================
        let pendingTargetAngle = null;
        let animationFramePending = false;
        function setTargetAngle(angle) {
            pendingTargetAngle = angle;
            if (!isAnimating) {
                isAnimating = true;
                startAnimationLoop();
            }
        }
        function startAnimationLoop() {
            if (animationFramePending) return;
            animationFramePending = true;
            function loop() {
                if (pendingTargetAngle !== null) {
                    targetPointerAngle = pendingTargetAngle;
                    pendingTargetAngle = null;
                }
                const diff = targetPointerAngle - currentPointerAngle;
                const absDiff = Math.abs(diff);
                const springK = 0.18;
                const damping = 0.65;
                const acceleration = diff * springK - pointerVelocity * damping;
                pointerVelocity += acceleration;
                currentPointerAngle += pointerVelocity;
                if (absDiff < 0.0003 && Math.abs(pointerVelocity) < 0.0002) {
                    currentPointerAngle = targetPointerAngle;
                    pointerVelocity = 0;
                    isAnimating = false;
                    animationFramePending = false;
                    animationId = null;
                    drawGauge(currentPointerAngle);
                    return;
                }
                if ((pointerVelocity > 0 && currentPointerAngle > targetPointerAngle && absDiff < 0.05) ||
                    (pointerVelocity < 0 && currentPointerAngle < targetPointerAngle && absDiff < 0.05)) {
                    currentPointerAngle = targetPointerAngle;
                    pointerVelocity = 0;
                    isAnimating = false;
                    animationFramePending = false;
                    animationId = null;
                    drawGauge(currentPointerAngle);
                    return;
                }
                drawGauge(currentPointerAngle);
                animationId = requestAnimationFrame(loop);
            }
            animationId = requestAnimationFrame(loop);
        }

        // ==================== 智能预测（线性回归） ====================
        function predictCompletionDate() {
            const records = getRecords();
            if (records.length < 3) return null;
            const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
            const startDate = new Date(sorted[0].date);
            const points = sorted.map(r => {
                const days = (new Date(r.date) - startDate) / (1000 * 60 * 60 * 24);
                return { days, total: 0 };
            });
            let runningTotal = 0;
            points.forEach((p, i) => { runningTotal += sorted[i].amount; p.total = runningTotal; });
            const n = points.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            points.forEach(p => { sumX += p.days; sumY += p.total; sumXY += p.days * p.total; sumX2 += p.days * p.days; });
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            if (slope <= 0) return null;
            const remaining = getRemainingGap();
            const currentTotal = getTotalSaved();
            const daysNeeded = Math.ceil(remaining / slope);
            const today = new Date();
            const completionDate = new Date(today.getTime() + daysNeeded * 24 * 60 * 60 * 1000);
            return { date: completionDate, daysNeeded, dailyRate: Math.round(slope) };
        }

        function renderTrendChart() {
            const w = trendCanvas.width;
            const h = trendCanvas.height;
            const dpr = window.devicePixelRatio || 1;
            trendCanvas.width = w * dpr;
            trendCanvas.height = h * dpr;
            trendCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            trendCtx.clearRect(0, 0, w, h);
            const records = getRecords();
            if (records.length < 2) {
                trendCtx.fillStyle = '#444';
                trendCtx.font = '11px sans-serif';
                trendCtx.textAlign = 'center';
                trendCtx.fillText('记录不足，无法绘制趋势', w / 2, h / 2);
                return;
            }
            const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
            let running = 0;
            const points = sorted.map(r => { running += r.amount; return running; });
            const maxVal = Math.max(...points);
            const minVal = 0;
            const range = maxVal - minVal || 1;
            const padX = 10, padY = 8;
            const plotW = w - padX * 2, plotH = h - padY * 2;
            // Grid
            trendCtx.strokeStyle = '#1a1a1a';
            trendCtx.lineWidth = 0.5;
            for (let i = 0; i < 4; i++) {
                const y = padY + (plotH / 3) * i;
                trendCtx.beginPath(); trendCtx.moveTo(padX, y); trendCtx.lineTo(w - padX, y); trendCtx.stroke();
            }
            // Line
            trendCtx.beginPath();
            trendCtx.strokeStyle = '#ff6b2b';
            trendCtx.lineWidth = 2;
            trendCtx.lineJoin = 'round';
            points.forEach((p, i) => {
                const x = padX + (i / (points.length - 1)) * plotW;
                const y = padY + plotH - ((p - minVal) / range) * plotH;
                if (i === 0) trendCtx.moveTo(x, y);
                else trendCtx.lineTo(x, y);
            });
            trendCtx.stroke();
            // Gradient fill
            const grad = trendCtx.createLinearGradient(0, padY, 0, h - padY);
            grad.addColorStop(0, 'rgba(255,107,43,0.25)');
            grad.addColorStop(1, 'rgba(255,107,43,0.02)');
            const lastX = padX + plotW;
            const lastY = padY + plotH - ((points[points.length - 1] - minVal) / range) * plotH;
            trendCtx.lineTo(lastX, h - padY);
            trendCtx.lineTo(padX, h - padY);
            trendCtx.closePath();
            trendCtx.fillStyle = grad;
            trendCtx.fill();
        }

            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.target.closest('.expense-item')?.classList.add('drag-over');
        }
        function handleDragLeave(e) {
            e.target.closest('.expense-item')?.classList.remove('drag-over');
        }
        function handleDrop(e) {
            e.preventDefault();
            e.target.closest('.expense-item')?.classList.remove('drag-over');
            const targetIndex = parseInt(e.target.closest('.expense-item').getAttribute('data-index'));
            if (dragSrcIndex !== null && targetIndex !== null && dragSrcIndex !== targetIndex) {
                const items = appData.expenseItems;
                const [moved] = items.splice(dragSrcIndex, 1);
                items.splice(targetIndex, 0, moved);
                saveData();
                renderExpenseList();
            }
            dragSrcIndex = null;
        }
        function handleDragEnd(e) {
            e.target.closest('.expense-item')?.classList.remove('dragging');
            document.querySelectorAll('.expense-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            dragSrcIndex = null;
        }

        // ==================== 推背感动画 ====================
        function triggerThrustAnimation() {
            const randomText = THRUST_POOL[Math.floor(Math.random() * THRUST_POOL.length)];
            const el = document.createElement('div');
            el.className = 'thrust-overlay';
            el.textContent = randomText;
            thrustContainer.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
            setTimeout(() => { if (el.parentNode) el.remove(); }, 1200);
        }

        // ==================== 涟漪效果 ====================
        function addRipple(e, el) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            el.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        }

        // ==================== 分享卡片 ====================
        function generateShareCard() {
            const sc = shareCanvas;
            const sctx = sc.getContext('2d');
            sc.width = 600; sc.height = 400;
            const dpr = window.devicePixelRatio || 1;
            sc.width = 600 * dpr; sc.height = 400 * dpr;
            sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const w = 600, h = 400;
            // Background
            const bgGrad = sctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#0d0d0d'); bgGrad.addColorStop(1, '#1a1020');
            sctx.fillStyle = bgGrad; sctx.fillRect(0, 0, w, h);
            // Decorative circles
            sctx.globalAlpha = 0.05;
            sctx.fillStyle = '#ff6b2b';
            sctx.beginPath(); sctx.arc(500, 80, 150, 0, Math.PI * 2); sctx.fill();
            sctx.beginPath(); sctx.arc(100, 320, 120, 0, Math.PI * 2); sctx.fill();
            sctx.globalAlpha = 1;
            // Title
            sctx.fillStyle = '#fff';
            sctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
            sctx.textAlign = 'center';
            sctx.fillText('🏍️ 春风250SR 攒钱进度', w / 2, 60);
            // Progress bar
            const progress = getProgressPercent();
            const barX = 80, barY = 100, barW = 440, barH = 30;
            sctx.fillStyle = '#222'; sctx.fillRect(barX, barY, barW, barH);
            const barGrad = sctx.createLinearGradient(barX, 0, barX + barW, 0);
            barGrad.addColorStop(0, '#ff6b2b'); barGrad.addColorStop(1, '#ff8c52');
            sctx.fillStyle = barGrad; sctx.fillRect(barX, barY, barW * progress, barH);
            sctx.fillStyle = '#fff'; sctx.font = 'bold 16px "SF Mono","Consolas",monospace';
            sctx.fillText(Math.round(progress * 100) + '%', w / 2, barY + 22);
            // Stats
            const saved = getTotalSaved();
            const target = getTotalTarget();
            const remaining = getRemainingGap();
            sctx.fillStyle = '#00e676'; sctx.font = 'bold 22px "SF Mono","Consolas",monospace';
            sctx.fillText('已攒: ' + formatCurrency(saved), w / 2, 190);
            sctx.fillStyle = '#4db6e8'; sctx.fillText('目标: ' + formatCurrency(target), w / 2, 225);
            sctx.fillStyle = '#ff6b2b'; sctx.fillText('剩余: ' + formatCurrency(remaining), w / 2, 260);
            // Prediction
            const prediction = predictCompletionDate();
            if (prediction && remaining > 0) {
                sctx.fillStyle = '#ffd600';
                sctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
                sctx.fillText('预计完成: ' + prediction.date.getFullYear() + '/' + (prediction.date.getMonth() + 1) + '/' + prediction.date.getDate(), w / 2, 300);
            }
            // Footer
            sctx.fillStyle = '#666';
            sctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
            sctx.fillText('春风250SR · 梦想在路上', w / 2, 360);
            // Show modal
            shareModal.classList.add('active');
        }
        function downloadShareCard() {
            const link = document.createElement('a');
            link.download = '250SR-攒钱进度-' + getTodayStr() + '.png';
            link.href = shareCanvas.toDataURL('image/png');
            link.click();
        }

        // ==================== 业务操作 ====================
        function addRecord(amount) {
            const today = getTodayStr();
            const existingIndex = getRecords().findIndex(r => r.date === today);
            if (existingIndex >= 0) {
                appData.records[existingIndex].amount = amount;
            } else {
                appData.records.push({ date: today, amount });
            }
            appData.records.sort((a, b) => a.date.localeCompare(b.date));
            saveData();
            renderAll();
            triggerThrustAnimation();
            playCoinSound();
            playEngineRev(amount);
            dailyAmountInput.value = '';
        }
        function deleteRecord(dateStr) {
            appData.records = getRecords().filter(r => r.date !== dateStr);
            saveData();
            renderAll();
            playDeleteSound();
            dailyAmountInput.value = '';
        }
        function toggleCoverExpense(id) {
            const item = getExpenseItems().find(it => it.id === id);
            if (item) { item.covered = !item.covered; saveData(); renderAll(); }
        }
        function deleteExpense(id) {
            if (editingExpenseId === id) editingExpenseId = null;
            appData.expenseItems = getExpenseItems().filter(it => it.id !== id);
            saveData(); renderAll(); playDeleteSound();
        }
        function addExpense(name, amount) {
            if (!name || amount <= 0) return;
            appData.expenseItems.push({ id: generateId(), name: name.trim(), amount: Math.round(amount), covered: false, image: null });
            saveData(); renderAll();
        }
        function updateExpense(id, name, amount) {
            const item = getExpenseItems().find(it => it.id === id);
            if (item) { item.name = name.trim(); item.amount = Math.round(amount); editingExpenseId = null; saveData(); renderAll(); }
        }
        function addExpenseImage(id) {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const item = getExpenseItems().find(it => it.id === id);
                    if (item) { item.image = ev.target.result; saveData(); renderAll(); }
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
        function showExpenseImage(id) {
            const item = getExpenseItems().find(it => it.id === id);
            if (item && item.image) {
                const win = window.open('', '_blank');
                win.document.write(`<img src="${item.image}" style="max-width:100%;max-height:100vh;" alt="${item.name}">`);
            }
        }

        // ==================== 计算器逻辑 ====================
        function calcUpdateDisplay() {
            let display = calcState.currentInput;
            if (display === '' || display === '-') display = '0';
            if (display.replace('-', '').replace('.', '').length > 10) calcDisplay.classList.add('shrink');
            else calcDisplay.classList.remove('shrink');
            calcDisplay.textContent = display;
        }
        function calcHandleDigit(value) {
            if (calcState.shouldResetDisplay) {
                calcState.currentInput = value === '.' ? '0.' : value;
                calcState.shouldResetDisplay = false;
            } else {
                if (value === '.') {
                    if (calcState.currentInput.includes('.')) return;
                    if (calcState.currentInput === '' || calcState.currentInput === '-') { calcState.currentInput += '0.'; calcUpdateDisplay(); return; }
                    calcState.currentInput += '.';
                } else {
                    if (calcState.currentInput === '0' && value !== '.') { calcState.currentInput = value; }
                    else { if (calcState.currentInput.replace('-', '').replace('.', '').length >= 15) return; calcState.currentInput += value; }
                }
            }
            calcState.lastAction = 'digit';
            calcUpdateDisplay();
        }
        function calcHandleOperator(op) {
            const current = parseFloat(calcState.currentInput);
            if (isNaN(current)) return;
            if (calcState.operator !== null && !calcState.shouldResetDisplay) calcHandleEquals();
            calcState.previousInput = calcState.currentInput;
            calcState.operator = op;
            calcState.shouldResetDisplay = true;
            calcState.lastAction = 'operator';
            calcUpdateDisplay();
        }
        function calcHandleEquals() {
            const current = parseFloat(calcState.currentInput);
            if (isNaN(current)) return;
            let result;
            const prev = parseFloat(calcState.previousInput);
            if (calcState.operator === null || isNaN(prev)) {
                calcState.previousInput = calcState.currentInput;
                calcState.shouldResetDisplay = true;
                calcState.lastAction = 'equals';
                calcUpdateDisplay();
                return;
            }
            switch (calcState.operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '×': result = prev * current; break;
                case '÷':
                    if (current === 0) { calcState.currentInput = 'Error'; calcState.operator = null; calcState.previousInput = ''; calcState.shouldResetDisplay = true; calcState.lastAction = 'equals'; calcUpdateDisplay(); return; }
                    result = prev / current; break;
                default: result = current;
            }
            // Fixed precision
            if (typeof result === 'number' && !Number.isInteger(result)) {
                result = parseFloat(result.toFixed(10));
            }
            const resultStr = String(result);
            calcState.currentInput = resultStr.length > 20 ? result.toExponential(6) : resultStr;
            calcState.operator = null;
            calcState.previousInput = '';
            calcState.shouldResetDisplay = true;
            calcState.lastAction = 'equals';
            calcUpdateDisplay();
        }
        function calcHandleClear() {
            calcState.currentInput = '0'; calcState.previousInput = ''; calcState.operator = null;
            calcState.shouldResetDisplay = false; calcState.lastAction = 'clear';
            calcDisplay.classList.remove('shrink');
            calcUpdateDisplay();
        }
        function calcHandleBackspace() {
            if (calcState.shouldResetDisplay) return;
            if (calcState.currentInput.length <= 1 || (calcState.currentInput.length === 2 && calcState.currentInput.startsWith('-'))) {
                calcState.currentInput = '0';
            } else { calcState.currentInput = calcState.currentInput.slice(0, -1); }
            calcUpdateDisplay();
        }
        function calcHandleKey(key) {
            if (key >= '0' && key <= '9') calcHandleDigit(key);
            else if (key === '.') calcHandleDigit('.');
            else if (key === '+') calcHandleOperator('+');
            else if (key === '-') calcHandleOperator('-');
            else if (key === '*') calcHandleOperator('×');
            else if (key === '/') calcHandleOperator('÷');
            else if (key === 'Enter' || key === '=') calcHandleEquals();
            else if (key === 'Escape' || key === 'c' || key === 'C') calcHandleClear();
            else if (key === 'Backspace') calcHandleBackspace();
        }

        // ==================== 主题切换（时间驱动） ====================
        function updateTheme() {
            const hour = new Date().getHours();
            const root = document.documentElement;
            root.classList.remove('theme-morning', 'theme-afternoon', 'theme-evening', 'theme-night');
            if (hour >= 5 && hour < 9) root.classList.add('theme-morning');
            else if (hour >= 9 && hour < 17) root.classList.add('theme-afternoon');
            else if (hour >= 17 && hour < 20) root.classList.add('theme-evening');
            else root.classList.add('theme-night');
        }

        // ==================== 初始化 ====================
        function refreshAll() {
            editingExpenseId = null;
            const initProgress = getProgressPercent();
            currentPointerAngle = progressToAngle(initProgress);
            targetPointerAngle = currentPointerAngle;
            pointerVelocity = 0;
            pendingTargetAngle = null;
            drawGauge(currentPointerAngle);
            renderAll();
            updateGaugeTarget();
        }
        function init() {
            loadData();
            updateTheme();
            setInterval(updateTheme, 60000);
            refreshAll();
            calcUpdateDisplay();
            console.log('🏍️ 250SR-Dream-Dash 已就绪');
        }

        // ==================== 事件处理 ====================
        btnConfirmRecord.addEventListener('click', (e) => {
            addRipple(e, btnConfirmRecord);
            const rawVal = dailyAmountInput.value.trim();
            const amount = parseInt(rawVal);
            if (isNaN(amount) || amount <= 0) {
                dailyAmountInput.style.borderColor = '#ff4444';
                dailyAmountInput.classList.add('inline-error');
                setTimeout(() => { dailyAmountInput.style.borderColor = '#444'; dailyAmountInput.classList.remove('inline-error'); }, 1500);
                return;
            }
            const todayRecord = getTodayRecord();
            if (todayRecord && todayRecord.amount === amount) { renderTodayHint(); return; }
            if (todayRecord && todayRecord.amount !== amount) { renderTodayHint(); return; }
            addRecord(amount);
        });
        dailyAmountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnConfirmRecord.click(); });
        dailyAmountInput.addEventListener('input', () => renderTodayHint());

        // Expense list delegation
        expenseListEl.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.getAttribute('data-action');
            const id = target.getAttribute('data-id');
            if (action === 'toggle-cover') toggleCoverExpense(id);
            else if (action === 'delete') { if (confirm('确定删除此费用条目吗？')) deleteExpense(id); }
            else if (action === 'edit') { editingExpenseId = id; renderExpenseList(); setTimeout(() => { const ni = expenseListEl.querySelector('.edit-name-input'); if (ni) ni.focus(); }, 50); }
            else if (action === 'save-edit') {
                const li = target.closest('.expense-item');
                const nameInput = li.querySelector('.edit-name-input');
                const amountInput = li.querySelector('.edit-amount-input');
                const newName = nameInput ? nameInput.value.trim() : '';
                const newAmount = amountInput ? parseInt(amountInput.value) : 0;
                if (!newName || isNaN(newAmount) || newAmount <= 0) {
                    expenseErrorEl.style.display = 'block';
                    expenseErrorEl.textContent = '请输入有效的名称和金额（金额需为正整数）';
                    setTimeout(() => { expenseErrorEl.style.display = 'none'; }, 3000);
                    return;
                }
                updateExpense(id, newName, newAmount);
            }
            else if (action === 'cancel-edit') { editingExpenseId = null; renderExpenseList(); }
            else if (action === 'add-image') addExpenseImage(id);
            else if (action === 'view-image') showExpenseImage(id);
        });

        // Today hint delegation
        todayHintEl.addEventListener('click', (e) => {
            if (e.target.id === 'btnOverwrite') {
                const rawVal = dailyAmountInput.value.trim();
                const amount = parseInt(rawVal);
                if (!isNaN(amount) && amount > 0) addRecord(amount);
            } else if (e.target.id === 'btnDeleteToday') {
                if (confirm('确定删除今日的记账记录吗？')) deleteRecord(getTodayStr());
            }
        });

        // Log list delegation
        logListEl.addEventListener('click', (e) => {
            if (e.target.getAttribute('data-action') === 'delete-record') {
                const dateStr = e.target.getAttribute('data-date');
                if (dateStr && confirm('确定删除 ' + formatDateDisplay(dateStr) + ' 的记账记录吗？')) deleteRecord(dateStr);
            }
        });

        // Add expense
        btnAddExpense.addEventListener('click', () => {
            const name = newExpenseNameInput.value.trim();
            const amount = parseInt(newExpenseAmountInput.value);
            if (!name) { newExpenseNameInput.focus(); newExpenseNameInput.style.borderColor = '#ff4444'; setTimeout(() => { newExpenseNameInput.style.borderColor = '#444'; }, 1500); return; }
            if (isNaN(amount) || amount <= 0) { newExpenseAmountInput.focus(); newExpenseAmountInput.style.borderColor = '#ff4444'; setTimeout(() => { newExpenseAmountInput.style.borderColor = '#444'; }, 1500); return; }
            addExpense(name, amount);
            newExpenseNameInput.value = ''; newExpenseAmountInput.value = '';
            newExpenseNameInput.focus();
        });
        newExpenseNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') newExpenseAmountInput.focus(); });
        newExpenseAmountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnAddExpense.click(); });

        // Calculator events
        document.querySelector('.calculator-buttons').addEventListener('click', (e) => {
            const btn = e.target.closest('.calc-btn');
            if (!btn) return;
            addRipple(e, btn);
            const action = btn.getAttribute('data-action');
            const value = btn.getAttribute('data-value');
            if (action === 'digit') calcHandleDigit(value);
            else if (action === 'operator') calcHandleOperator(value);
            else if (action === 'equals') calcHandleEquals();
            else if (action === 'clear') calcHandleClear();
        });

        // Global keyboard
        document.addEventListener('keydown', (e) => {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            const key = e.key;
            if ((key >= '0' && key <= '9') || key === '.' || key === '+' || key === '-' || key === '*' || key === '/' ||
                key === 'Enter' || key === '=' || key === 'Escape' || key === 'Backspace' || key === 'c' || key === 'C') {
                e.preventDefault();
                calcHandleKey(key);
            }
        });

        // Export/Import
        document.getElementById('btnExport').addEventListener('click', exportData);
        document.getElementById('btnImport').addEventListener('click', importData);

        // Share
        document.getElementById('btnShare').addEventListener('click', generateShareCard);
        document.getElementById('btnDownloadShare').addEventListener('click', downloadShareCard);
        document.getElementById('btnCloseShare').addEventListener('click', () => shareModal.classList.remove('active'));
        shareModal.addEventListener('click', (e) => { if (e.target === shareModal) shareModal.classList.remove('active'); });

        // Target date
        document.getElementById('btnSetTargetDate').addEventListener('click', () => {
            const val = targetDateInput.value;
            if (val) { setTargetDate(val); renderAll(); }
        });
        document.getElementById('btnClearTargetDate').addEventListener('click', () => {
            setTargetDate(null);
            targetDateInput.value = '';
            renderAll();
        });

        // Sound toggles
        toggleSoundBtn.addEventListener('click', () => {
            appData.soundEnabled = !appData.soundEnabled;
            toggleSoundBtn.textContent = appData.soundEnabled ? '🔊 音效' : '🔇 音效';
            toggleSoundBtn.classList.toggle('on', appData.soundEnabled);
            saveData();
        });
        toggleEngineBtn.addEventListener('click', () => {
            appData.engineEnabled = !appData.engineEnabled;
            toggleEngineBtn.textContent = appData.engineEnabled ? '🏍️ 声浪' : '🔇 声浪';
            toggleEngineBtn.classList.toggle('on', appData.engineEnabled);
            saveData();
        });
        // Init toggle states
        if (!appData.soundEnabled) { toggleSoundBtn.textContent = '🔇 音效'; toggleSoundBtn.classList.remove('on'); }
        if (!appData.engineEnabled) { toggleEngineBtn.textContent = '🔇 声浪'; toggleEngineBtn.classList.remove('on'); }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
